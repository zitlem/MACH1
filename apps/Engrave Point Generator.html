document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.dxfScale }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">%<\u002Fspan><\u002Fdiv><\u002Flabel><\u002Fdiv><\u002Fdiv><\u002Fsc-if><span style=\"color:#6b7780;font-size:13px;line-height:1.4\">Lines, arcs, circles, polylines, splines and ellipses are cut along their lines at the cut depth, after the letters. Text, hatches and dimensions in the DXF are skipped (type text in the Text box). X Y are from work zero; end a value with mm for millimeters.<\u002Fspan><\u002Fsection>\n      <section style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid #e3e7ea\"><h2 style=\"margin:0;font-family:Barlow,'Segoe UI',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12px;line-height:1.3;color:#6b7780\">Machining<\u002Fh2><div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Curves<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:#eef1f3;padding:2px;border-radius:8px\"><sc-for list=\"{{ curveSeg }}\" as=\"o\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font:500 14px Barlow,'Segoe UI',sans-serif;background:{{ o.bg }};color:{{ o.fg }};box-shadow:{{ o.sh }};border:0;border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left;line-height:1.3;overflow-wrap:anywhere\">{{ o.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv><sc-if value=\"{{ arcMode }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end\"><div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Arc format<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:#eef1f3;padding:2px;border-radius:8px\"><sc-for list=\"{{ arcFmtSeg }}\" as=\"o\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font:500 14px Barlow,'Segoe UI',sans-serif;background:{{ o.bg }};color:{{ o.fg }};box-shadow:{{ o.sh }};border:0;border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left;line-height:1.3;overflow-wrap:anywhere\">{{ o.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Arc tolerance<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"0.0001\" min=\"0.00005\" value=\"{{ cfg.arcTol }}\" sc-camel-on-change=\"{{ on.arcTol }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">in<\u002Fspan><\u002Fdiv><\u002Flabel><\u002Fdiv><span style=\"color:#6b7780;font-size:13px;line-height:1.4\">Curves are fitted with true arcs, each 175° or less, that stay within the tolerance. I J = arc center measured from the arc start point. Pick a letter to see the arc centers.<\u002Fspan><\u002Fsc-if><div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px\"><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Cut depth<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"0.001\" min=\"0\" value=\"{{ cfg.depth }}\" sc-camel-on-change=\"{{ on.depth }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">in<\u002Fspan><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Depth per pass<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"0.001\" min=\"0\" value=\"{{ cfg.passDepth }}\" sc-camel-on-change=\"{{ on.passDepth }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">in<\u002Fspan><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Safe Z<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"0.01\" value=\"{{ cfg.safeZ }}\" sc-camel-on-change=\"{{ on.safeZ }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">in<\u002Fspan><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Rapid plane<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"0.01\" min=\"0\" value=\"{{ cfg.rapidZ }}\" sc-camel-on-change=\"{{ on.rapidZ }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">in<\u002Fspan><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Feed<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"1\" min=\"0\" value=\"{{ cfg.feed }}\" sc-camel-on-change=\"{{ on.feed }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">in/min<\u002Fspan><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Plunge<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"1\" min=\"0\" value=\"{{ cfg.plunge }}\" sc-camel-on-change=\"{{ on.plunge }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">in/min<\u002Fspan><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Spindle<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"500\" min=\"0\" value=\"{{ cfg.rpm }}\" sc-camel-on-change=\"{{ on.rpm }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">rpm<\u002Fspan><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Decimals<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"1\" min=\"1\" max=\"6\" value=\"{{ cfg.dec }}\" sc-camel-on-change=\"{{ on.dec }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><\u002Fdiv><\u002Flabel><\u002Fdiv><span style=\"color:#6b7780;font-size:13px;line-height:1.4\">Safe Z is the lift-off height between strokes and letters. The tool rapids down to the rapid plane, then feeds to depth at the plunge rate; a rapid plane at or above Safe Z feeds all the way from Safe Z. Depth per pass 0 = one pass at full depth. Cut twice runs each stroke again backwards at full depth and ends where it started, a cleanup pass that doubles cutting time.<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><label style=\"display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ cfg.twice }}\" sc-camel-on-change=\"{{ on.twice }}\" style=\"accent-color:#1d2a33;width:16px;height:16px;margin:0\">Cut twice: out, then back at full depth<\u002Flabel><label style=\"display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ cfg.spindle }}\" sc-camel-on-change=\"{{ on.spindle }}\" style=\"accent-color:#1d2a33;width:16px;height:16px;margin:0\">Include spindle M3 / M5<\u002Flabel><label style=\"display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ cfg.coolant }}\" sc-camel-on-change=\"{{ on.coolant }}\" style=\"accent-color:#1d2a33;width:16px;height:16px;margin:0\">Coolant M8 on first feed line / M9<\u002Flabel><label style=\"display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ cfg.lineNums }}\" sc-camel-on-change=\"{{ on.lineNums }}\" style=\"accent-color:#1d2a33;width:16px;height:16px;margin:0\">Line numbers (N10, N20…)<\u002Flabel><\u002Fdiv><p style=\"color:#6b7780;font-size:13.5px;margin:0\">Generic G-code: G20 inch, G90 absolute, Z0 = top of part. Dry-run above the part before cutting.<\u002Fp><\u002Fsection>\n        <section style=\"display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid #e3e7ea\"><h2 style=\"margin:0;font-family:Barlow,'Segoe UI',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12px;line-height:1.3;color:#6b7780\">Mazak Mazatrol<\u002Fh2><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Program name <span style=\"font-weight:400;color:#6b7780\">(.PBD / .PBM file name)<\u002Fspan><\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"text\" maxlength=\"32\" spellcheck=\"false\" placeholder=\"{{ mazAuto }}\" value=\"{{ cfg.mazName }}\" sc-camel-on-change=\"{{ on.mazName }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;text-transform:uppercase\"><\u002Fdiv><\u002Flabel><div style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Tool<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:#eef1f3;padding:2px;border-radius:8px\"><sc-for list=\"{{ mazToolSeg }}\" as=\"o\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ o.onClick }}\" style=\"grid-column:{{ o.span }};font:500 14px Barlow,'Segoe UI',sans-serif;background:{{ o.bg }};color:{{ o.fg }};box-shadow:{{ o.sh }};border:0;border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left;line-height:1.3;overflow-wrap:anywhere\">{{ o.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px\"><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">NOM-Ø<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"0.001\" min=\"0\" value=\"{{ cfg.mazNom }}\" sc-camel-on-change=\"{{ on.mazNom }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">in<\u002Fspan><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Suffix (No.)<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"text\" maxlength=\"1\" spellcheck=\"false\" value=\"{{ cfg.mazSuf }}\" sc-camel-on-change=\"{{ on.mazSuf }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;text-transform:uppercase\"><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Material<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"text\" maxlength=\"8\" spellcheck=\"false\" value=\"{{ cfg.mazMat }}\" sc-camel-on-change=\"{{ on.mazMat }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;text-transform:uppercase\"><\u002Fdiv><\u002Flabel><label style=\"display:flex;flex-direction:column;gap:4px;min-width:0\"><span style=\"font-weight:600;font-size:14px;line-height:1.25\">Initial Z<\u002Fspan><div style=\"display:flex;align-items:stretch;border:1px solid #d5dbdf;background:#fff;border-radius:6px;overflow:hidden\"><input type=\"number\" step=\"0.1\" value=\"{{ cfg.mazInitZ }}\" sc-camel-on-change=\"{{ on.mazInitZ }}\" style=\"flex:1;min-width:0;width:0;border:0;background:transparent;color:#1d2a33;font:500 14px 'IBM Plex Mono',Consolas,monospace;padding:7px 8px;font-variant-numeric:tabular-nums\"><span style=\"font:500 12.5px Barlow,'Segoe UI',sans-serif;color:#6b7780;padding:0 9px 0 4px;display:flex;align-items:center;white-space:nowrap;flex:none\">in<\u002Fspan><\u002Fdiv><\u002Flabel><\u002Fdiv><sc-if value=\"{{ hasMazWarn }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;color:#c2362b;font-size:13.5px;line-height:1.4\">{{ mazWarn }}<\u002Fp><\u002Fsc-if><div style=\"display:flex;flex-direction:column;gap:2px\"><sc-for list=\"{{ mazStats }}\" as=\"s\" hint-placeholder-count=\"2\"><span style=\"font:500 13px 'IBM Plex Mono',Consolas,monospace;color:#1d2a33\">{{ s.label }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><p style=\"color:#6b7780;font-size:13.5px;margin:0\">Download .PBD for a Matrix mill or .PBM for a Smooth mill with the buttons at the top. Inch program: set the control to inch. Uses the machining settings above, including arcs (G2/G3 with I J or R). The tool must be in the machine’s tool data with the same type, NOM-Ø and suffix. Long jobs split into MANL PRG units of up to 253 sequences (.PBD) or 997 (.PBM); each unit restarts with G90, G17, G94, S and M3, plus M8 on its first feed line when coolant is on. No WPC unit is written.<\u002Fp><\u002Fsection>\n    <\u002Faside>\n\n    <main data-printflat=\"\" style=\"flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n      <div data-printonly=\"\" style=\"display:none;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid #e3e7ea;border-radius:8px;overflow:hidden;background:#fff\">\n        <sc-for list=\"{{ printSum }}\" as=\"p\" hint-placeholder-count=\"9\"><div style=\"grid-column:{{ p.col }};padding:6px 9px;border-bottom:1px solid #e3e7ea;min-width:0\"><span style=\"display:block;font-family:Barlow,'Segoe UI',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;color:#6b7780\">{{ p.k }}<\u002Fspan><span style=\"font:12.5px 'IBM Plex Mono',Consolas,monospace;word-break:break-word\">{{ p.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <section data-printkeep=\"\" style=
