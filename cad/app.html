<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAD</title>
<style>
:root{--ink:#1d2a33;--mute:#6b7780;--line:#e3e7ea;--line2:#d5dbdf;--bg:#f6f7f8;--card:#fff;--red:#c2362b;--warnbg:#fff6e5;--warnln:#f0d9a8;--warnink:#7a5200;--ok:#1e8a4c;--vp:#1f2a31;--acc:#2f6fb0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Barlow,'Segoe UI',system-ui,sans-serif;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);overflow:hidden}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0 10px 0 0;letter-spacing:.02em}
.top .name{color:var(--mute);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:2px 8px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:2px;padding:0 10px;background:var(--card)}
.tabs button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.ribbon{display:flex;gap:4px;padding:5px 10px 3px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;height:92px}
/* groups keep their width; a tab with more buttons than fit scrolls sideways */
.grp{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:0 6px 0 0;margin-right:2px;flex:none}
.grp:last-child{border-right:0}
.grp .bs{display:flex;gap:1px;flex:1}
.grp .gl{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:1px;text-align:center;white-space:nowrap}
/* a button: its icon over a label of up to two lines; a long word widens the button rather than breaking */
.rb{border:1px solid transparent;background:none;border-radius:6px;padding:4px 4px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px;max-width:96px;flex:none}
.rb span{font-size:11.5px;line-height:1.15;text-align:center;max-width:88px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* the icons (lib/cad-icons.js): lines in the text colour, blue for what a command makes, red for what it removes */
.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico .a{stroke:var(--acc)} .ico .r{stroke:var(--red)} .ico .g{stroke:var(--ok)} .ico .dash{stroke-dasharray:2 2.2;opacity:.7}
.ico .f{fill:currentColor;stroke:none} .ico .fa{fill:var(--acc);stroke:none} .ico .fb{fill:#d3e3f3;stroke:var(--acc)}
.ico .t{fill:#eef2f5} .ico .l{fill:#cfd9e1} .ico .k{fill:#aebdc9}
.btn .ico{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.rb:hover{background:var(--bg);border-color:var(--line2)}
.rb.on{background:#e8f0f8;border-color:#b8cde3}
main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
aside{background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:10px 12px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:4px 0 8px}
.f{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.f>span{font-size:13px;color:var(--mute)}
.f input,.f select{border:1px solid var(--line2);border-radius:6px;padding:4px 7px;background:#fff;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--bg);border-radius:7px;padding:2px;margin-bottom:8px}
.seg button{flex:1 1 auto;border:0;background:none;padding:4px 7px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chk{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px}
.prompt{background:#e8f0f8;border:1px solid #b8cde3;border-radius:6px;padding:6px 8px;margin-bottom:10px;font-weight:600}
.note{font-size:12.5px;color:var(--mute);margin:4px 0 8px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
table.lv{width:100%;border-collapse:collapse;font-size:13px}
table.lv td{padding:3px 4px;border-bottom:1px solid var(--line)}
table.lv input[type=text]{border:1px solid transparent;background:none;width:100%;padding:1px 3px;border-radius:4px}
table.lv input[type=text]:focus{border-color:var(--line2);background:#fff}
table.lv tr.act td{background:#f0f5fa}
/* the history: a timeline of the steps, oldest on the left; the red mark is where you are, steps undone after it */
.tl{position:relative;display:flex;align-items:center;gap:2px;padding:3px 10px;background:var(--card);border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;height:40px;scrollbar-width:thin}
.tl .lab{flex:none;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-right:6px}
.tl button{flex:none;width:30px;height:30px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tl button:hover{border-color:var(--line2);background:var(--bg)}
.tl button.cur{background:#e8f0f8;border-color:#b8cde3}
.tl button.undone{opacity:.35}
.tl button.undone:hover{opacity:.8}
.tl .ico{width:20px;height:20px}
.tl .now{flex:none;width:3px;height:28px;background:var(--red);border-radius:2px;margin:0 3px}
.tl .empty{flex:none;font-size:12.5px;color:var(--mute);margin-left:6px}
#tip{position:fixed;z-index:30;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.35;border-radius:6px;padding:6px 9px;pointer-events:none;max-width:340px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#tip b{display:block;font-size:13px}
#tip .d{color:#c9d3da}
#tip em{display:block;font-style:normal;color:#9fb6c8;margin-top:2px}
.ebox{border:1px solid var(--line);border-radius:7px;padding:7px 8px 0;margin-bottom:8px}
.ebox>b{display:block;font-size:13px;margin-bottom:6px}
.ebox .row{gap:2px 8px}
.ebox .f{margin-bottom:6px}
.ebox .f input,.ebox .f select{padding:2px 6px}
.info{font-size:13px;background:var(--bg);border-radius:6px;padding:6px 8px;margin:6px 0;white-space:pre-wrap;font-family:'IBM Plex Mono',Consolas,monospace}
#vp{position:relative;background:var(--vp);min-width:0;min-height:0;overflow:hidden;cursor:crosshair}
#vp canvas{display:block;width:100%;height:100%;outline:none}
#glyph{position:absolute;pointer-events:none;font:11px/1 'IBM Plex Mono',Consolas,monospace;color:#ffd23f;transform:translate(10px,-18px);white-space:nowrap}
#glyph::before{content:'';position:absolute;left:-15px;top:13px;width:8px;height:8px;border:1.5px solid #ffd23f;transform:translate(-50%,-50%)}
#win{position:absolute;border:1px solid #38c6f4;background:rgba(56,198,244,.08);pointer-events:none;display:none}
#win.cross{border-style:dashed;background:rgba(60,207,110,.08);border-color:#3ccf6e}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(20,28,34,.92);color:#fff;padding:6px 12px;border-radius:6px;font-size:13px;max-width:80%;display:none}
#toast.err{background:rgba(160,40,30,.95)}
#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;padding:30px;text-align:center}
footer{display:flex;align-items:center;gap:10px;padding:3px 10px;background:var(--card);border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
footer .xy{font-family:'IBM Plex Mono',Consolas,monospace;min-width:230px}
footer select,footer input{border:1px solid var(--line2);border-radius:5px;padding:1px 4px;background:#fff;font-size:13px}
footer select{max-width:150px}
footer input{width:64px}
footer .sn{display:flex;gap:2px}
footer .sn button{border:1px solid var(--line2);background:#fff;border-radius:4px;padding:0 5px;font-size:12px;cursor:pointer;color:var(--mute)}
footer .sn button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #0003;vertical-align:-3px}
dialog{border:1px solid var(--line2);border-radius:10px;max-width:760px;width:90vw;padding:16px 18px}
.flash{background:#fff3c4;transition:background .8s}
#find{position:absolute;width:340px;max-width:calc(100% - 12px);background:var(--card);border:1px solid var(--line2);border-radius:8px;box-shadow:0 6px 22px #0005;cursor:default;overflow:hidden;z-index:5}
#find input{width:100%;border:0;border-bottom:1px solid var(--line);padding:8px 10px;outline:none;background:var(--card);font-size:14px}
#findList .fh{padding:5px 10px 2px;font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
#findList .fr{display:flex;gap:8px;align-items:flex-start;padding:5px 10px;cursor:pointer}
#findList .fr.on{background:#e8f0f8}
#findList .fr b{font-weight:600}
#findList .fr .where{color:var(--mute);font-size:12px;white-space:nowrap}
#findList .fr .what{color:var(--mute);font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#findList .none{padding:8px 10px;color:var(--mute);font-size:13px}
#findList .fr .how{color:var(--acc);font-size:12px;white-space:nowrap}
ol.how{padding-left:22px;margin:8px 0}
ol.how li{margin:0 0 8px}
ol.how .btn{display:inline-flex;align-items:center;gap:4px;margin-left:8px;vertical-align:middle}
ol.how .ico{width:18px;height:18px}
.keycols{columns:2 300px;column-gap:24px}
.keycols>div{break-inside:avoid;margin-bottom:8px}
.keycols h4{margin:8px 0 4px;font-size:13px}
table.keys{border-collapse:collapse;font-size:13px}
table.keys td{padding:2px 8px 2px 0;vertical-align:top}
kbd{font:12px 'IBM Plex Mono',Consolas,monospace;background:var(--bg);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;white-space:nowrap}
dialog pre{max-height:50vh;overflow:auto;background:var(--bg);padding:8px;font-size:11.5px;white-space:pre-wrap}
</style>
</head>
<body>
<header class="top">
  <h1>CAD</h1>
  <button class="btn sm" data-cmd="new" title="New drawing">New</button>
  <button class="btn sm" data-cmd="open" title="Open a drawing (Ctrl+O)">Open…</button>
  <button class="btn sm" data-cmd="save" title="Save as a MACH1 CAD file (Ctrl+S)">Save</button>
  <button class="btn sm" data-cmd="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button class="btn sm" data-cmd="redo" title="Redo (Ctrl+Y)">Redo</button>
  <span class="name" id="docName"></span>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="ribbon" id="ribbon"></div>
<main>
  <aside id="panel"></aside>
  <div id="vp" tabindex="0"><div id="glyph" hidden></div><div id="win"></div><div id="toast"></div>
    <div id="find" hidden><input id="findIn" autocomplete="off" spellcheck="false" placeholder="What do you want to do?" aria-label="Find a command"><div id="findList"></div></div>
    <div id="nogl">This computer's browser gives this page no WebGL 2, so the drawing cannot be shown. Turn on hardware acceleration in the browser's settings, or use another computer.</div></div>
</main>
<div class="tl" id="timeline" aria-label="History"></div>
<div id="tip" hidden></div>
<footer>
  <span class="xy" id="xy">X 0 Y 0</span>
  <label>Plane <select id="sPlane"></select></label>
  <label>Z <input id="sZ" value="0" inputmode="decimal" title="The depth new entities are drawn at, along the plane's normal"></label>
  <label>Level <select id="sLevel"></select></label>
  <label>Colour <select id="sCol"></select></label>
  <label>Style <select id="sStyle"><option value="">Solid</option><option value="dash">Dashed</option><option value="center">Centre</option><option value="hidden">Hidden</option><option value="phantom">Phantom</option></select></label>
  <label>Width <select id="sWidth"><option value="">Thin</option><option value="med">Medium</option><option value="thick">Thick</option></select></label>
  <span class="sn"><button id="sCons" type="button" title="Draw new entities as construction geometry: dashed and dimmed, snapped to, left out of chains, solids and files">Constr</button></span>
  <span class="sn" id="snaps"></span>
  <label>Grid <select id="sGrid"><option value="auto">auto</option><option>1</option><option>0.5</option><option>0.25</option><option>0.1</option><option>0.05</option><option>0.01</option></select></label>
  <span id="units">inch</span>
  <span id="hidNote" hidden style="color:var(--warnink)">Some things are hidden (Alt+E shows them)</span>
  <span id="kstat" style="color:var(--mute)"></span><button class="btn sm" id="kstop" hidden title="The solids kernel is taking a long time: stop it, and leave out the feature changed last">Stop</button>
</footer>
<input type="file" id="fileIn" hidden accept=".mach1cad,.json,.dxf,.svg,.dwg,.z,.step,.stp,.igs,.iges,.stl,.obj,.3mf,.pdf,.mcam,.emcam,.mcx">
<dialog id="dlg"><div id="dlgBody"></div><div class="btns" style="justify-content:flex-end"><button class="btn" id="dlgClose">Close</button></div></dialog>
<script type="text/plain" id="lib-mesh">/*@@MESH@@*/</script>
<script type="text/plain" id="lib-kernel">/*@@KERNEL@@*/</script>
<script type="text/plain" id="wasm-kernel">/*@@KERNELWASM@@*/</script>
<script type="text/plain" id="lib-dwg">/*@@DWG@@*/</script>
<script type="text/plain" id="wasm-dwg">/*@@DWGWASM@@*/</script>
<script type="text/plain" id="lib-iges">/*@@IGES@@*/</script>
<script type="text/plain" id="lib-pdf-gz">/*@@PDFGZ@@*/</script>
<script type="text/plain" id="wasm-iges">/*@@IGESWASM@@*/</script>
<script>/*@@THREE@@*/</script>
<script>/*@@CAD@@*/</script>
<script>
'use strict';
const T = THREE, G = CADGeom, M = CADModel, IO = CADIO;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
const fmt = (v, d = 4) => { const s = (+v).toFixed(d); return s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s; };
const RAD = Math.PI / 180, KEY = 'mach1-cad-v1', UIKEY = 'mach1-cad-ui-v1';
const store = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

// ================================================================ the document
// (#fresh in the address: start with an empty drawing, not the one kept from last time)
const FRESH = /(^|#)fresh\b/.test(location.hash.slice(1));
let doc = (() => { if (FRESH) return M.create(); try { const s = load(KEY); if (s) return M.fromJSON(JSON.parse(s)); } catch (e) { } return M.create(); })();
let fileName = doc.name && doc.name !== 'Untitled' ? doc.name : '';
// a plane point (x, y) at depth z as a world point, and back, on the drawing's planes (its own as well as Top, Front
// and Right)
const toW = (pl, p, z) => M.toWorld(doc.plane(pl), p, z), fromW = (pl, w) => M.fromWorld(doc.plane(pl), w);
let sel = new Set();
const ui = Object.assign({ tab: 'Wireframe', snaps: { end: true, mid: true, ctr: true, int: true, quad: true, near: false, grid: false }, grid: 'auto', showGrid: true, shade: 'edges', meshUnits: 'mm' }, (() => { try { return JSON.parse(load(UIKEY) || '{}'); } catch (e) { return {}; } })());
const saveUI = () => store(UIKEY, JSON.stringify({ tab: ui.tab, snaps: ui.snaps, grid: ui.grid, showGrid: ui.showGrid, showAxes: ui.showAxes, shade: ui.shade, lastShade: ui.lastShade, meshUnits: ui.meshUnits, recent: ui.recent }));
let docVer = 0;                  // goes up with every change: what is worked out from the drawing is kept until then
function changed() {
  docVer++; chainCache = null;
  syncScene(); renderStatus(); renderTimeline(); if (!cmd) renderPanel(); solidsChanged();
  autosave();
}
// ---- autosave: a second after the last change, when the page is idle, the drawing goes to the browser's own
// database (IndexedDB) as it is, meshes as arrays: nothing is turned into text, however big. Should that database not
// be there, a small drawing goes to localStorage as before; one kept there by an older version is moved over.
let saveTimer = null, saveTicket = 0;
const IDB = {};
function idb() {
  if (IDB.p) return IDB.p;
  IDB.p = new Promise((res, rej) => {
    let q; try { q = indexedDB.open('mach1-cad', 1); } catch (e) { rej(e); return; }
    q.onupgradeneeded = () => q.result.createObjectStore('doc');
    q.onsuccess = () => { const db = q.result; db.onversionchange = () => { db.close(); IDB.p = null; }; res(db); };
    q.onerror = () => rej(q.error);
  });
  IDB.p.catch(() => { IDB.p = null; });
  return IDB.p;
}
const idbDo = (mode, fn) => idb().then(db => new Promise((res, rej) => { const t = db.transaction('doc', mode), q = fn(t.objectStore('doc')); t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => rej(t.error); }));
function autosave(now) {
  clearTimeout(saveTimer); const ticket = ++saveTicket;
  const go = () => {
    if (ticket !== saveTicket) return;
    idbDo('readwrite', st => st.put({ saved: Date.now(), name: fileName, doc: doc.toJSON(true) }, 'current')).then(() => { try { localStorage.removeItem(KEY); } catch (e) { } }, () => {
      let est = doc.ents.size * 200; for (const b of doc.bodies.values()) est += (b.pos ? b.pos.byteLength * 1.4 : 0); for (const t of doc.blobs.values()) est += t.length;
      if (est < 4e6) { const s = JSON.stringify(doc.toJSON()); if (s.length < 4.5e6) store(KEY, s); }
    });
  };
  if (now) go(); else saveTimer = setTimeout(() => (window.requestIdleCallback || (f => setTimeout(f, 0)))(go, { timeout: 3000 }), 1000);
}
addEventListener('pagehide', () => { if (saveTimer) autosave(true); });
function attach() { doc.onChange(changed); }
// the active plane, depth, level and colour: kept in the file, but not undo steps
function setAct(patch) { doc.active = Object.assign({}, doc.active, patch); changed(); }
attach();

// ================================================================ the viewport
const vp = $('vp');
let renderer = null;
try { renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); if (!renderer.capabilities.isWebGL2) throw new Error('no WebGL2'); }
catch (e) { renderer = null; $('nogl').style.display = 'flex'; }
const scene = new T.Scene(), gModel = new T.Group(), gPre = new T.Group(), gGrid = new T.Group(), gMark = new T.Group(), gBodies = new T.Group(), gXL = new T.Group();
scene.add(gGrid, gBodies, gModel, gXL, gPre, gMark);
const gMove = new T.Group(); scene.add(gMove);
const cam = new T.OrthographicCamera(-1, 1, 1, -1, -1e5, 1e5);
// light from over the viewer's shoulder, turning with the view
scene.add(cam); scene.add(new T.HemisphereLight(0xffffff, 0x4a5560, 1.6));
const key = new T.DirectionalLight(0xffffff, 1.6); key.position.set(0.4, 0.6, 1); cam.add(key);
// the view: what it looks at, how it is turned (camera orientation) and its scale (inches per pixel)
const view = { target: new T.Vector3(0, 0, 0), q: new T.Quaternion(), s: 0.01 };
const VIEWS = {
  top: new T.Quaternion(),
  front: new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), Math.PI / 2),
  right: new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 0, 1), Math.PI / 2).multiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), Math.PI / 2)),
  iso: new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 0, 1), Math.PI / 4).multiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), Math.atan(Math.SQRT2))),
};
if (renderer) { vp.appendChild(renderer.domElement); renderer.domElement.tabIndex = 0; renderer.localClippingEnabled = true; }
// ---- the view cube, top right: click a face to look at it
const CUBE = 92, cubeScene = new T.Scene(), cubeCam = new T.OrthographicCamera(-1.75, 1.75, 1.75, -1.75, -10, 10);
const cubeFaces = [['RIGHT', [1, 0, 0]], ['LEFT', [-1, 0, 0]], ['BACK', [0, 1, 0]], ['FRONT', [0, -1, 0]], ['TOP', [0, 0, 1]], ['BOTTOM', [0, 0, -1]]];
const cube = new T.Mesh(new T.BoxGeometry(2, 2, 2), cubeFaces.map(([t]) => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.fillStyle = '#dfe6eb'; x.fillRect(0, 0, 128, 128); x.strokeStyle = '#8a97a0'; x.lineWidth = 6; x.strokeRect(0, 0, 128, 128);
  x.fillStyle = '#1d2a33'; x.font = 'bold 26px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, 64, 64);
  const tx = new T.CanvasTexture(c); tx.colorSpace = T.SRGBColorSpace; return new T.MeshBasicMaterial({ map: tx });
}));
// the labels read the right way up: BoxGeometry's side faces have +Z up already; top and bottom are turned to match Front
cubeScene.add(cube);
function drawCube() {
  if (!renderer) return;

const base = () => (fileName || 'drawing').replace(/\.[^.]+$/, '');
function dl(name, data, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

async function openFile(f, merge) {
  const ext = (f.name.match(/\.([^.]+)$/) || [])[1] || '';
  try {
    const x = ext.toLowerCase();
    if (/^(mcam|emcam|mcx|mcx-\d+)$/.test(x)) throw new Error('This is a Mastercam file, which no program outside Mastercam can read: its format is closed. In Mastercam, use File > Save As and pick STEP (.stp) or DXF (.dxf), then open that here.');
    if (x === 'mach1cad' || x === 'json') { const d = M.fromJSON(JSON.parse(await f.text())); if (merge) mergeIn({ ents: d.list(), levels: [...d.levels.values()] }, f.name); else setDoc(d, f.name.replace(/\.[^.]+$/, '')); return; }
    let r;
    if (x === 'svg') r = IO.readSVG(await f.text());
    else if (/^(dxf|dwg|z)$/.test(x) || !/^(stl|obj|3mf|step|stp|igs|iges|pdf)$/.test(x)) {
      // what the file holds decides, not its name: a machine's ".dwg" can be its own drawing, and compressed
      let bytes = new Uint8Array(await f.arrayBuffer());
      if (IO.isCompressed(bytes)) bytes = IO.unlzw(bytes);
      const kind = IO.sniff(bytes);
      if (kind === 'mswin') { r = await readEDM(bytes, f.name); if (!r) return; }
      else if (kind === 'dwg') { toast('Reading ' + f.name + '…'); r = IO.readDXF(IO.dwgToDXF((await aux('dwg', bytes.slice().buffer)).db), 'auto'); }
      else if (kind === 'dxf' || x === 'dxf') r = IO.readDXF(new TextDecoder().decode(bytes), 'auto');
      else throw new Error('This ' + (x ? '.' + x + ' ' : '') + 'file is not a DXF, an AutoCAD DWG or a Mitsubishi EDM drawing, the drawings this page reads' + (x === 'dwg' ? ' (a real DWG starts with AC10…)' : ''));
    }
    else if (/^(stl|obj|3mf)$/.test(x)) { await openMesh(f, x, merge); return; }
    else if (/^(step|stp)$/.test(x)) { await openSTEP(f, merge); return; }
    else if (/^(igs|iges)$/.test(x)) { await openIGES(f, merge); return; }
    else if (x === 'pdf') { toast('Reading ' + f.name + '…'); r = await readPDF(f); }
    else throw new Error('This page does not read .' + x + ' files');
    // whatever read it, an entity with numbers that are not finite or are absurdly large is left out and counted
    const bad = r.ents.filter(e => !G.sane(e.g) || !G.sane(e.z)).length;
    if (bad) { r.ents = r.ents.filter(e => G.sane(e.g) && G.sane(e.z)); r.skipped = Object.assign({}, r.skipped); r.skipped['damaged (numbers out of range)'] = (r.skipped['damaged (numbers out of range)'] || 0) + bad; }

    else { const d = M.create({ name: f.name.replace(/(\.(dxf|dwg|z))+$/i, '').replace(/\.[^.]+$/, '') || f.name }); d.levels = new Map(r.levels.map(l => [l.n, l])); d.planes = new Map((r.planes || []).map(q => [q.key, q])); setDoc(d, d.name); doc.addMany(r.ents.map(e => ({ g: e.g, props: M.attrs(e) })), 'Open ' + f.name); doc.undoStack = []; fit(); }
    const sk = Object.entries(r.skipped || {}).map(([k, v]) => v + ' ' + k).join(', ');
    toast(r.ents.length + ' entities from ' + f.name + (r.units === 'mm' ? ' (mm, turned into inches)' : '') + (sk ? '. Not read: ' + sk : '') + (r.notes && r.notes.length ? '. ' + r.notes.join(' ') : ''));

}
// a Mitsubishi EDM drawing: its units asked, the likely ones (from how big its numbers are) offered first

  const u = await askUnits(name, { guess, why: 'This is a Mitsubishi EDM drawing, and those do not say their units. Its numbers run up to ' + fmt(peek.extent, 3) + ', so ' + (guess === 'mm' ? 'millimetres' : 'inches') + ' is likely. Are they millimetres or inches?' });

// ---- meshes: STL and OBJ have no units, so ask (the last answer is offered first); 3MF says its own. opts: {guess,
// why} for other files (the answer then is not kept for meshes)
function askUnits(name, opts) {

    $('dlgBody').innerHTML = `<h3 style="margin-top:0">${esc(name)}</h3><p>${esc(o.why || 'This file does not say its units. Are its numbers millimetres or inches?')}</p>
      <div class="btns"><button class="btn${first === 'mm' ? ' primary' : ''}" data-u="mm">Millimetres</button><button class="btn${first === 'in' ? ' primary' : ''}" data-u="in">Inches</button></div>`;
    const d = $('dlg'); d.showModal();
    const pick = e => { const u = e.target.dataset.u; if (!u) return; d.removeEventListener('click', pick); d.close(); if (!o.guess) { ui.meshUnits = u; saveUI(); } res(u); };
    d.addEventListener('click', pick);

const inflateRaw = raw => new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
async function openMesh(f, x, merge) {

  if (x === '3mf') units = r.units;

async function openSTEP(f, merge) {

// the solids' triangles as plain triangles (for STL, OBJ and 3MF)
function solidSoup(so) { const v = so.mesh.v, t = so.mesh.t, out = new Float32Array(t.length * 3); for (let i = 0; i < t.length; i++) { out[3 * i] = v[3 * t[i]]; out[3 * i + 1] = v[3 * t[i] + 1]; out[3 * i + 2] = v[3 * t[i] + 2]; } return { pos: out, name: so.key }; }

  const all = new Float32Array(bodies.reduce((n, b) => n + b.pos.length, 0)); let o = 0; for (const b of bodies) { all.set(b.pos, o); o += b.pos.length; }

function mergeIn(r, name) {

// ================================================================ solids: the kernel in a worker
// The worker is made from the page's own text (the kernel bundle, lib/cad-kernel.js and the lines below), so nothing
// is fetched. It is started when the page has been idle a moment, or when a solid is first needed.
const WORKER = `
let K = null, R = null, last = [];
const post = (m, tr) => self.postMessage(m, tr || []);
self.onmessage = async e => {
  const m = e.data;
  try {
    if (m.cmd === 'init') {
      const t0 = performance.now(), res = await fetch('data:application/gzip;base64,' + m.wasm);
      const bin = await new Response(res.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      const mod = await WebAssembly.compile(bin);
      const oc = await MACH1_KERNEL.init({ instantiateWasm: (imp, cb) => { WebAssembly.instantiate(mod, imp).then(i => cb(i, mod)); return {}; }, print() {}, printErr() {} });
      R = MACH1_KERNEL.replicad; R.setOC(oc); K = CADKernel.create(R);
      post({ re: m.re, ok: true, ms: performance.now() - t0 }); return;
    }
    if (m.cmd === 'build') {
      // STEP texts come once (m.blobs), and are kept by their keys
      for (const k of Object.keys(m.blobs || {})) { try { await K.readSTEP(m.blobs[k], k); } catch (err) { } }
      for (const f of m.feats) if (f.type === 'step' && !f.suppressed && f.text) { try { await K.readSTEP(f.text); } catch (err) { } }
      const r = K.build(m.feats); last = r.solids;
      // with each solid's triangles, a box tree for picking (lib/cad-mesh.js)
      const out = r.solids.map(s => { const me = K.mesh(s.shape); me.bvh = CADMesh.bvh(me.v, me.t); const b = s.shape.boundingBox.bounds; return { key: s.key, volume: s.volume, area: s.area, mesh: me, box: b }; });
      post({ re: m.re, ok: true, solids: out, status: r.status }, out.flatMap(s => [s.mesh.v.buffer, s.mesh.n.buffer, s.mesh.t.buffer, s.mesh.lines.buffer, s.mesh.bvh.box.buffer, s.mesh.bvh.meta.buffer, s.mesh.bvh.order.buffer])); return;
    }
    if (m.cmd === 'step') { const sh = last.filter(s => !m.keys || m.keys.includes(s.key)).map(s => s.shape); if (!sh.length) throw new Error('There are no solids'); post({ re: m.re, ok: true, text: await K.stepOf(sh) }); return; }
    if (m.cmd === 'curves') { const so = last.find(s => s.key === m.key); if (!so) throw new Error('That solid is not there'); post({ re: m.re, ok: true, r: K.curvesOf(so.shape, m.opts) }); return; }
    if (m.cmd === 'readstep') { const s = await K.readSTEP(m.text, m.key); post({ re: m.re, ok: true, volume: R.measureVolume(s) }); return; }
    // for test/cad-stress.js: busy for m.ms, and an error nothing catches
    if (m.cmd === 'spin') { const t = performance.now(); while (performance.now() - t < m.ms) { } post({ re: m.re, ok: true }); return; }
    if (m.cmd === 'crash') { setTimeout(() => { throw new Error('a test crash'); }); return; }
  } catch (err) { post({ re: m.re, ok: false, err: String(err && err.message || err) }); }
};`;
let kWorker = null, kReady = null, kSeq = 0, kBlobs = new Set();     // kBlobs: the STEP texts this worker has
const kPend = new Map();
function kernel() {

  kstat('Solids kernel: starting…');
  const code = $('lib-mesh').textContent + '\n' + $('lib-kernel').textContent + '\n' + WORKER;
  kBlobs = new Set();
  const w = kWorker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
  w.onmessage = e => { const p = kPend.get(e.data.re); if (!p) return; kPend.delete(e.data.re); e.data.ok ? p.res(e.data) : p.rej(new Error(e.data.err)); };
  // a crash (out of memory, say): start again and rebuild, once for the same history, so a history that crashes it
  // every time does not go round and round
  w.onerror = e => {
    e.preventDefault(); if (w !== kWorker) return;
    const retry = doc.feats.length > 0 && featsKey !== crashKey; crashKey = featsKey;
    kFail('The solids kernel stopped (' + (e.message || 'an error') + ')' + (retry ? ': starting it again' : ''));
    if (retry) { if (building) again = true; else rebuild(); }
  };
  const ready = kReady = kcall('init', { wasm: $('wasm-kernel').textContent.trim() }, true).then(r => { kstat('Solids kernel ready (' + Math.round(r.ms) + ' ms)'); return true; }, err => { kstat('Solids kernel failed: ' + err.message, true); if (kReady === ready) kReady = null; throw err; });

function kcall(cmd, data, direct) {

// A call that takes over 4 s (OpenCascade stuck on some geometry, or the worker gone without a word) offers Stop;
// starting up is left alone, as that can take a while on a slow computer.
setInterval(() => { let first = Infinity; for (const p of kPend.values()) if (p.cmd !== 'init') first = Math.min(first, p.t); $('kstop').hidden = !(performance.now() - first > 4000); }, 500);

let crashKey = null;
$('kstop').onclick = () => {

  kFail('Stopped');
  if (f) { doc.setFeats(doc.feats.map(x => x === f ? Object.assign({}, x, { suppressed: true }) : x), 'Leave feature out'); toast('Stopped. "' + featName(f) + '" is left out of the solids: tick it in the Solids list to try it again.'); }

// ---- the mesh worker: reads STL, OBJ and 3MF, and works out what the screen needs of a mesh (lib/cad-mesh.js prep)
const MESHWORKER = `
const inflateRaw = raw => new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
self.onmessage = async e => {

  try {
    let mesh = null;

const meshPend = new Map();
function meshWork(msg, transfer) {

    w.onmessage = e => { const p = meshPend.get(e.data.re); if (!p) return; meshPend.delete(e.data.re); e.data.ok ? p.res(e.data) : p.rej(new Error(e.data.err)); };
    w.onerror = e => { e.preventDefault(); w.terminate(); if (meshW === w) meshW = null; const waiting = [...meshPend.values()]; meshPend.clear(); for (const p of waiting) p.rej(new Error('The mesh reader stopped (' + (e.message || 'an error') + ')')); };
  }
  return new Promise((res, rej) => { const re = ++meshSeq; meshPend.set(re, { res, rej }); meshW.postMessage(Object.assign({ re }, msg), transfer || []); });

// ---- DWG and IGES readers: each in a worker of its own, started for the file and closed after it
const AUX = { dwg: ['lib-dwg', 'wasm-dwg'], iges: ['lib-iges', 'wasm-iges'] };

      const cs = S.ents.map(x => x.e), dia = has(F, 'dia') ? fv(F, 'dia') : 2 * cs[0].g.r;
      const groups = new Map(); for (const c of cs) { const k = c.pl + (has(F, 'dia') ? '' : ':' + fmt(c.g.r)); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
      kernel();
      doc.batch('Holes', () => { for (const g of groups.values()) addFeat({ type: 'hole', pts: g.map(c => toW(c.pl, c.g.c, c.z)), dir: doc.plane(g[0].pl).n.map(v => -v), dia: has(F, 'dia') ? dia : 2 * g[0].g.r, depth: num(F.depth, 0.5), through: !!F.through, target: lastSolid() }); });

  },
  sbox: {
    name: 'Box', fields: [fld('h', 'Height', 'in', '1'), segs('op', '', OPS, 'new')],
    need: S => S.pts.length < 2 ? P(S.pts.length ? 'Opposite corner' : 'First corner (on the active plane, at its depth)') : null,
    preview(S, F, cur) { const p = S.pts.concat(cur ? [cur] : []); return p.length > 1 ? G.fromShapes([{ closed: true, pts: [[p[0][0], p[0][1]], [p[1][0], p[0][1]], [p[1][0], p[1][1]], [p[0][0], p[1][1]]] }]) : []; },
    make(S, F) {
      const [a, b] = S.pts, z = doc.active.z, h = num(F.h, 1), pl = doc.active.pl; kernel();
      if (!doc.planes.has(pl)) { addFeat({ type: 'box', c1: toW(pl, a, z), c2: toW(pl, b, z + h), op: F.op, target: F.op === 'new' ? null : lastSolid() }); return 'done'; }
      if (!(Math.abs(b[0] - a[0]) > 1e-9 && Math.abs(b[1] - a[1]) > 1e-9 && h > 0)) throw new Error('The box has no size');

    },
  },
  scyl: {
    name: 'Cylinder', fields: [fld('dia', 'Diameter', 'in', '1'), fld('h', 'Height', 'in', '1'), segs('op', '', OPS, 'new')],

    make(S, F) { kernel(); addFeat({ type: 'cyl', p: toW(doc.active.pl, S.pts[0], doc.active.z), d: doc.plane(doc.active.pl).n, r: num(F.dia, 1) / 2, h: num(F.h, 1), op: F.op, target: F.op === 'new' ? null : lastSolid() }); return 'done'; },
  },
  sfillet: edgeCmd('fillet', 'Fillet edges', 'Radius', '0.125'),
  schamfer: edgeCmd('chamfer', 'Chamfer edges', 'Distance', '0.05'),
  sbool: {
    name: 'Boolean', fields: [segs('op', '', [['add', 'Add'], ['cut', 'Remove'], ['common', 'Common']], 'add')],
    need: S => S.ents.length < 2 ? { kind: 'body', prompt: S.ents.length ? 'The tool solid (it is used up)' : 'The solid to change', solids: true } : null,

  },

function edgeCmd(type, name, label, def) {

    finishable: S => S.edges && S.edges.length > 0,
    need: S => S.done ? null : { kind: 'edge', prompt: S.edges && S.edges.length ? S.edges.length + ' edges: pick more, or Enter' : 'Pick edges' },
    make(S, F) {
      const key = S.edges[0].key; if (!S.edges.every(e => e.key === key)) throw new Error('All the edges must be on one solid');
      addFeat({ type, target: key, r: num(F.r, 0), picks: S.edges.map(e => e.p) }); S.edges = []; markEdges(); return 'done';
    },

}

// ---- the history list
function featsHtml() {
  if (!doc.feats.length) return '<p class="note">No solids yet: Solids → Extrude a closed chain, or open a STEP file.</p>';
  return `<table class="lv">${doc.feats.map((f, i) => { const st = featStatus.get(f.id); return `<tr><td><input type="checkbox" data-fsup="${f.id}"${f.suppressed ? '' : ' checked'} title="In use (untick to leave it out)"></td><td style="width:18px;color:${st && !st.ok ? 'var(--red)' : 'var(--ok)'}" title="${esc(st && st.err || '')}">${st ? (st.ok ? (st.skipped ? '–' : '✓') : '✗') : '…'}</td><td><a href="#" data-fedit="${f.id}">${esc(featName(f))}</a>${st && !st.ok ? `<div class="note" style="color:var(--red);margin:0">${esc(st.err)}</div>` : ''}</td><td><button class="btn sm" data-fdel="${f.id}" title="Delete this feature">✕</button></td></tr>`; }).join('')}</table>
    <p class="note">${solids.length} solid${solids.length === 1 ? '' : 's'}${solids.length ? ': ' + solids.map(s => s.key + ' ' + fmt(s.volume) + ' in³').join(', ') : ''}</p>`;
}
// editing a feature's numbers
const FEAT_FIELDS = { extrude: [['dist', 'Distance']], revolve: [['angle', 'Angle']], cyl: [['r', 'Radius'], ['h', 'Height']], hole: [['dia', 'Diameter'], ['depth', 'Depth']], fillet: [['r', 'Radius']], chamfer: [['r', 'Distance']], shell: [['t', 'Wall (less than 0: outward)']], draft: [['angle', 'Angle']] };
CMDS.featedit = { name: 'Edit feature', fields: [], need: S => S.done ? null : { kind: 'idle', prompt: 'Change the numbers, then OK' }, finishable: () => true,
  onStart() { const f = doc.feats.find(x => x.id === editId); if (!f) return; this.fields = (FEAT_FIELDS[f.type] || []).map(([k, l]) => fld(k, l, k === 'angle' ? '°' : 'in', String(f[k]))); F = {}; for (const fl of this.fields) F[fl.k] = fl.def; if (f.op) { this.fields.push(segs('op', '', OPS, f.op)); F.op = f.op; } renderPanel(); },
  make(S, F) { lastFeat = editId; doc.setFeats(doc.feats.map(f => { if (f.id !== editId) return f; const g = Object.assign({}, f); for (const [k] of FEAT_FIELDS[f.type] || []) if (isFinite(num(F[k], NaN))) g[k] = num(F[k], 0); if (F.op) g.op = F.op; return g; }), 'Edit feature'); return 'done'; } };
let editId = null;

// ================================================================ start
renderRibbon(); renderPanel(); renderStatus(); renderTimeline(); syncScene(); setTimeout(() => { resize(); fit(true); }, 0);
// the drawing kept from last time, unless something has been done already
if (!FRESH) { const ver0 = docVer; idbDo('readonly', st => st.get('current')).then(v => { if (v && v.doc && docVer === ver0) setDoc(M.fromJSON(v.doc), v.name || ''); }).catch(() => { }); }
if (doc.feats.length) solidsChanged(); else setTimeout(() => { if (!kReady && typeof WebAssembly === 'object') kernel().catch(() => {}); }, 2500);
window.CADAPP = { KEYS, find: { get items() { findIndex(); return [...findById.values()]; }, search: q => CADFind.search(findIndex(), q, 8), missing: () => CADFind.missing(RIBBON), open: openFind, close: closeFind, get rows() { return findRows; } }, isClosedChain, renderPanel, shapeOf, get grips() { return gripList; }, get drag() { return drag; },  get blockKeys() { return [...blocks.keys()]; }, get shownSolids() { return [...solidsShown.keys()]; }, get shownBodies() { return [...bodiesShown.keys()]; }, get shownEnts() { return [...shown.keys()]; }, clip, kernel, kcall, get solids() { return solids; }, get featStatus() { return featStatus; }, edgeAt, get S() { return S; }, get doc() { return doc; }, startCmd, feed, finishCmd, endCmd, get sel() { return sel; }, set sel(s) { sel = s; paintSel(); }, view, setView, fit, openFile, ACTIONS, IO, snapAt, toScreen, updProj };
